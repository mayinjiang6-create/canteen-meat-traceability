services:
  trusted-rag:
    build: .
    image: trusted-rag:1.0
    container_name: trusted-rag
    environment:
      PORT: "8000"
      # 可选：设置后由离线抽取式切换为生成式，约束逻辑不变
      # LLM_API_KEY: ${LLM_API_KEY:-}
      # LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      # LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
