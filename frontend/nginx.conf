# 客户现场只暴露一个入口：Nginx 80 → 静态页面 + /api 反代到 backend:8080
# 前后端同源的好处：不需要 CORS，浏览器侧没有跨域预检，链不可达时也只是一个慢响应
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传凭证类请求留余量（当前业务无大文件，预留避免后续改动踩坑）
    client_max_body_size 20m;

    # 入口页不缓存：升级后刷新即生效，避免客户看到旧版本
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Docker 内置 DNS：后端容器重启换 IP 后能自动重新解析
    # （直接写死 proxy_pass http://backend:8080 只会在启动时解析一次，重启后会 502）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 链不可达时后端约有 5s 熔断超时，这里留一倍余量
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # SPA history 路由：/trace/PB20261118001 直接刷新不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
