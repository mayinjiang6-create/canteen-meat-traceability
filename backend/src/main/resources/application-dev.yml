spring:
  datasource:
    url: jdbc:mysql://localhost:3306/meat_trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:meat}
    password: ${DB_PASSWORD:Meat@2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: meat-trace-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 演示环境务必 false：校验失败时宁可启动失败，也不清库
    clean-on-validation-error: false

chain:
  webase:
    base-url: http://192.168.239.130:5002/WeBASE-Front
    group-id: group0
    app-id: meattrace
    sign-user-id: meattraceadmin
    user-address: "0x0bd53242ca7ee7fb0ce57a3cb296b6d4b237dbe8"
    contract-name: TraceRegistry
    contract-path: trace
    contract-address: "0xd24180cc0fef2f3e545de4f9aafc09345cd08903"
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
  rpc:
    url: http://192.168.239.130:8545
    timeout-ms: 5000
  evidence:
    worker-enabled: false        # 链未就绪时先关，避免无谓重试
    poll-interval-ms: 2000
    max-retry: 5

trace:
  cold-chain:
    pork-max-temp: 4.0
    beef-max-temp: 4.0
    frozen-max-temp: -15.0
